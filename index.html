<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗼 טוקיו 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1e2540;--bg2:#192038;--card:#263050;--card2:#2e3a60;
  --pink:#ff6b9d;--purple:#a78bfa;--cyan:#22d3ee;--yellow:#fbbf24;
  --green:#34d399;--red:#f87171;--text:#ecf0fa;--text2:#c8d5ec;--border:#374070;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh}


/* ── APP ── */
#app{display:flex;flex-direction:column;min-height:100vh}


/* HEADER */
.hdr{
  background:linear-gradient(160deg,#202840 0%,#231638 100%);
  padding:14px 16px 0;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100
}
.hdr-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hdr-ico{font-size:1.7rem;filter:drop-shadow(0 0 10px rgba(255,107,157,.4))}
.hdr-info h1{font-size:1.2rem;font-weight:900;color:var(--pink)}
.hdr-info p{font-size:.76rem;color:var(--text2);margin-top:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:9px 15px;border-radius:9px 9px 0 0;font-size:.81rem;font-weight:700;
  cursor:pointer;white-space:nowrap;color:var(--text2);
  border:1px solid transparent;border-bottom:none;transition:all .15s
}
.tab.on{background:var(--card);color:var(--text);border-color:var(--border)}
.tab:hover:not(.on){color:var(--text)}

/* CONTENT */
.content{flex:1;padding:14px;max-width:680px;margin:0 auto;width:100%}
.sec{display:none}.sec.on{display:block}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;margin-bottom:11px;overflow:hidden}
.card-hdr{
  padding:13px 15px;cursor:pointer;display:flex;align-items:center;gap:11px;
  transition:background .15s
}
.card-hdr:hover{background:var(--card2)}
.ch-ico{font-size:1.4rem}
.ch-txt{flex:1}
.ch-txt h3{font-size:1.04rem;font-weight:800}
.ch-txt p{font-size:.76rem;color:var(--text2);margin-top:2px}
.ch-note{font-size:.76rem;color:var(--yellow);margin-top:3px}
.chevron{font-size:.7rem;color:var(--text2);transition:transform .2s}
.card.open .chevron{transform:rotate(180deg)}
.card-body{display:none;padding:0 15px 13px;border-top:1px solid var(--border)}
.card.open .card-body{display:block}

/* ACTIVITY */
.act{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid #2e3c60;align-items:flex-start}
.act:last-child{border-bottom:none}
.act-time{font-size:.80rem;color:var(--text2);min-width:40px;padding-top:2px}
.act-ico{font-size:1.05rem;min-width:22px;text-align:center}
.act-cnt{flex:1}
.act-ttl{font-size:.96rem;font-weight:700}
.act-note{font-size:.84rem;color:var(--text2);margin-top:4px;line-height:1.5}
.act-price{font-size:.86rem;color:var(--yellow);font-weight:700;margin-top:4px}
.act-alt{font-size:.82rem;color:var(--green);margin-top:3px}
.act-shop .act-cnt{border-right:3px solid var(--purple);padding-right:9px;margin-right:-9px}
.act-shop .act-ttl{color:var(--pink)}
.shop-tag{display:inline-block;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;font-size:.65rem;padding:1px 8px;border-radius:10px;margin-left:5px;font-weight:800;vertical-align:middle}
.lb{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;font-size:.62rem;font-weight:900;color:#fff;vertical-align:middle;padding:0 2px;margin:0 2px}
.lb-r{border-radius:8px;padding:0 5px}
.trk-sw{display:flex;gap:8px;padding:10px 0 8px;margin-bottom:6px;border-bottom:1px solid var(--border)}
.trk-btn{padding:6px 16px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--text2);font-size:.82rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.trk-btn.on{background:linear-gradient(135deg,var(--purple),var(--pink));border-color:transparent;color:#fff}
.trk-note{font-size:.8rem;color:var(--yellow);padding:6px 2px 8px;border-bottom:1px solid var(--border);margin-bottom:4px}

.act-imgs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}.act-img{width:96px;height:96px;border-radius:9px;overflow:hidden;display:inline-block;background:#1a2040;vertical-align:top}.act-img img{width:100%;height:100%;object-fit:contain;display:block;transition:opacity .3s}.act-img img.loaded{opacity:1}.act-img img{opacity:0}

.act-img img{opacity:0}
.act-img img{opacity:0}

.act-img img{opacity:0}
.act-img img{opacity:0}

.act-img img{opacity:0}
.act-img img{opacity:0}

.act-img img{opacity:0}
.act-img img{opacity:0}


/* FLIGHTS */
.flight-leg{
  background:var(--card2);border-radius:12px;padding:13px;
  margin-bottom:10px;border:1px solid var(--border)
}
.fl-badge{
  display:inline-block;padding:2px 9px;border-radius:9px;
  font-size:.71rem;font-weight:800;margin-left:8px
}
.fl-out{background:rgba(167,139,250,.15);color:var(--purple)}
.fl-in{background:rgba(34,211,238,.15);color:var(--cyan)}
.fl-route{display:flex;align-items:center;gap:10px;margin:10px 0;direction:ltr}
.fl-city{font-size:1.35rem;font-weight:900;text-align:center}
.fl-sub{font-size:.72rem;color:var(--text2);text-align:center}
.fl-arr{flex:1;text-align:center;color:var(--text2);font-size:1.2rem}
.fl-dur{font-size:.75rem;color:var(--text2)}
.fl-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.fl-item .lbl{font-size:.71rem;color:var(--text2)}
.fl-item .val{font-size:.86rem;font-weight:700}

/* HOTEL */
.htl-hero{
  background:linear-gradient(135deg,rgba(255,107,157,.08),rgba(167,139,250,.08));
  border:1px solid rgba(255,107,157,.25);border-radius:13px;
  padding:14px;margin-bottom:12px
}
.htl-name{font-size:1.05rem;font-weight:900;color:var(--pink);margin-bottom:10px}
.irow{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid #2e3c60}
.irow:last-child{border-bottom:none}
.ilbl{font-size:.76rem;color:var(--text2);min-width:105px;padding-top:1px}
.ival{font-size:.86rem;font-weight:600;flex:1}

/* OFFICE BANNER */
.office-banner{
  background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.25);
  border-radius:12px;padding:13px;margin-top:12px
}
.missed-section{
  margin-top:14px;border-top:1px dashed var(--border);padding-top:12px;
}
.missed-label{
  font-size:.76rem;font-weight:800;color:var(--text2);opacity:.7;
  letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.missed-label::after{content:'';flex:1;height:1px;background:var(--border);opacity:.5;}
.missed-act{
  display:flex;gap:10px;align-items:flex-start;padding:7px 0;
  opacity:.42;filter:grayscale(.35);
  border-bottom:1px solid rgba(255,255,255,.04);
}
.missed-act:last-child{border-bottom:none;}
.missed-act .act-time{font-size:.72rem;color:var(--text2);min-width:36px;padding-top:2px;}
.missed-act .act-ico{font-size:1rem;min-width:22px;text-align:center;}
.missed-act .act-ttl{font-size:.8rem;color:var(--text2);}
.missed-tag{
  display:inline-block;font-size:.65rem;background:rgba(251,191,36,.12);
  color:var(--yellow);border-radius:4px;padding:1px 5px;margin-top:3px;
}

/* FOOD */
.food-card{
  background:var(--card2);border-radius:12px;padding:13px;
  margin-bottom:9px;border:1px solid var(--border);
  display:flex;gap:11px;align-items:flex-start
}
.food-ico{font-size:1.5rem}
.food-cnt h4{font-size:.92rem;font-weight:800;margin-bottom:3px}
.food-cnt p{font-size:.8rem;color:var(--text2);line-height:1.5}
.ftags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ftag{font-size:.71rem;padding:2px 7px;border-radius:8px;font-weight:700}
.tp{background:rgba(251,191,36,.13);color:var(--yellow)}
.ta{background:rgba(52,211,153,.13);color:var(--green)}
.tm{background:rgba(248,113,113,.13);color:var(--red)}

/* TIPS */
.tip-card{
  background:var(--card2);border-radius:0 12px 12px 0;
  border-right:3px solid var(--cyan);padding:13px;margin-bottom:9px
}
.tip-card h4{font-size:.88rem;font-weight:800;color:var(--cyan);margin-bottom:5px}
.tip-card p{font-size:.81rem;color:var(--text2);line-height:1.5}

/* BOOKING BOX */
.booking-box{
  background:rgba(255,107,157,.07);border:1px solid rgba(255,107,157,.22);
  border-radius:13px;padding:14px;margin-bottom:14px
}
.bk-title{color:var(--pink);font-weight:900;font-size:1rem;margin-bottom:10px}
</style>
</head>

function getActImage(name) {
  if (!name) return null;
  const clean = name.replace(/<[^>]+>/g,'');
  for (const [kw, url] of IMG_MAP) {
    if (clean.includes(kw)) return url;
  }
  return null;
}

      const m = String(a.p).match(/¥([\d,]+)/);
      if (m) total += parseInt(m[1].replace(/,/g,''));
    }
  }
  return total;
}

function setTrack(dayId,trackId,btn){
  const card=document.getElementById(dayId);
  card.querySelectorAll('.trk-acts').forEach(el=>el.style.display='none');
  card.querySelectorAll('.trk-btn').forEach(el=>el.classList.remove('on'));
  const el=document.getElementById(dayId+'-'+trackId);
  if(el)el.style.display='block';
  if(btn)btn.classList.add('on');
  const day=DAYS.find(d=>'day'+d.id===dayId);
  if(day&&day.tracks){
    const track=day.tracks.find(t=>t.id===trackId);
    if(track){
      const costEl=document.getElementById('hdr-cost-'+day.id);
      if(costEl)costEl.innerHTML=day.dow+' &nbsp;·&nbsp; 🚇 ~¥'+calcTransportYen(track.acts);
    }
    // Show missed activities when on 'work' track
    const missedId=dayId+'-missed';
    let existingMissed=document.getElementById(missedId);
    if(existingMissed)existingMissed.remove();
    if(trackId==='work'){
      const workTrack=day.tracks.find(t=>t.id==='work');
      const freeTrack=day.tracks.find(t=>t.id==='free');
      if(workTrack&&freeTrack){
        const workTimes=new Set(workTrack.acts.map(a=>a.t));
        const workNames=new Set(workTrack.acts.map(a=>(a.n||'').replace(/<[^>]+>/g,'')));
        const missed=freeTrack.acts.filter(a=>{
          const cleanN=(a.n||'').replace(/<[^>]+>/g,'');
          return !workTimes.has(a.t)&&!workNames.has(cleanN);
        });
        if(missed.length>0){
          const html=`<div class="missed-section" id="${missedId}">
            <div class="missed-label">📌 ביום מלא גם — מה מפספסת</div>
            ${missed.map(a=>`
              <div class="missed-act">
                <div class="act-time">${a.t||''}</div>
                <div class="act-ico">${a.i||'·'}</div>
                <div><div class="act-ttl">${(a.n||'').replace(/<[^>]+>/g,'')}</div>
                ${a.p?`<span class="missed-tag">${a.p}</span>`:''}
                </div>
              </div>`).join('')}
          </div>`;
          if(el)el.insertAdjacentHTML('beforeend',html);
        }
      }
    }
  }
}

            <div style="flex:2;min-width:120px">
              <div style="font-size:.78rem;font-weight:700;margin-bottom:2px">${tr.from}</div>
              <div style="font-size:.72rem;color:var(--text2)">→ ${tr.to}</div>
              <div style="margin-top:4px"><span style="background:${tr.color};color:#fff;padding:2px 7px;border-radius:8px;font-size:.69rem;font-weight:800">${tr.badge}</span> <span style="font-size:.73rem;color:var(--text2)">${tr.line}</span></div>
            </div>
            <div style="text-align:left;min-width:80px">
              <div style="font-weight:900;color:var(--yellow);font-size:.86rem">${tr.jpy}</div>
              <div style="font-size:.72rem;color:var(--text2)">${tr.usd} · ${tr.time}</div>
            </div>
            <div style="width:100%;font-size:.72rem;margin-top:3px;${tr.suica.startsWith('⚠')?'color:var(--red)':'color:var(--green)'}">${tr.suica}</div>
          </div>`).join('')}
      </div>
    </div>`;
}

// ─────────────────────────── LAUNCH ───────────────────────────
document.getElementById('app').classList.add('on');




renderDays();renderFlights();renderHotel();renderFood();renderTips();renderMoney();
</script>
