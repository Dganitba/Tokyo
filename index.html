<title>טוקיו 2026 🗾</title>
<style>
:root{--bg:#1e2540;--bg2:#192038;--card:#263050;--pink:#ff6b9d;--purple:#a78bfa;--yellow:#fbbf24;--red:#f87171;--text:#ecf0fa;--text2:#c8d5ec;--border:#374070;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif;color:var(--text);
  background-image:radial-gradient(ellipse at 20% 50%,rgba(167,139,250,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(255,107,157,.06) 0%,transparent 50%);}
.lock{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px 36px 36px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.lock-ico{font-size:48px;margin-bottom:16px;}
h1{font-size:28px;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.5;}
.sub span{color:var(--yellow);font-weight:600;}
label{display:block;text-align:right;font-size:13px;color:var(--text2);margin-bottom:6px;}
input{width:100%;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:18px;text-align:center;letter-spacing:4px;outline:none;transition:border-color .2s;}
input:focus{border-color:var(--purple);}
button{width:100%;margin-top:14px;padding:13px;background:linear-gradient(135deg,var(--pink),var(--purple));border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s;}
button:hover{opacity:.9;}
button:disabled{opacity:.6;cursor:not-allowed;}
#err{margin-top:12px;color:var(--red);font-size:14px;min-height:20px;}
.deco{margin-top:24px;font-size:11px;color:var(--border);letter-spacing:3px;}
</style>
</head>

<script>
async function go(){
  var pw=document.getElementById('pw').value;if(!pw)return;
  var btn=document.querySelector('button');btn.textContent='⏳ טוען...';btn.disabled=true;
  try{
    var s=Uint8Array.from(atob(document.getElementById('s').textContent),function(x){return x.charCodeAt(0);});
    var iv=Uint8Array.from(atob(document.getElementById('i').textContent),function(x){return x.charCodeAt(0);});
    var ct=Uint8Array.from(atob(document.getElementById('c').textContent),function(x){return x.charCodeAt(0);});
    var kb=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:100000,hash:'SHA-256'},kb,{name:'AES-GCM',length:256},false,['decrypt']);
    var dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct);
    var html=new TextDecoder().decode(dec);
    var ifr=document.createElement('iframe');
    ifr.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:9999;background:#1e2540';
    ifr.srcdoc=html;
    document.body.appendChild(ifr);
    document.body.style.overflow='hidden';
  }catch(e){
    document.getElementById('err').textContent='סיסמה שגויה — נסי שוב';
    document.getElementById('pw').value='';btn.textContent='פתח את המסלול 🌸';btn.disabled=false;
  }
}
</script>
