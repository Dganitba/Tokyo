async function go(){
  const pw=document.getElementById('pw').value;
  try{
    const s=Uint8Array.from(atob(D.salt),c=>c.charCodeAt(0));
    const n=Uint8Array.from(atob(D.nonce),c=>c.charCodeAt(0));
    const c=Uint8Array.from(atob(D.ct),c=>c.charCodeAt(0));
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:n},k,c);
    const html=new TextDecoder().decode(dec);
    document.open();document.write(html);document.close();
  }catch(e){
    const err=document.getElementById('err');
    err.style.display='block';
    document.getElementById('pw').value='';
    setTimeout(()=>err.style.display='none',2000);
  }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
</script>
